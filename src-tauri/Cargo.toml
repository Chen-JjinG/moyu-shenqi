[package]
name = "diagnostic-tools"
version = "0.1.0"
description = "诊断工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "diagnostic_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "DiagnosticTools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
